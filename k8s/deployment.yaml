
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartcampus
  namespace: smartcampus

spec:
  replicas: 3

  selector:
    matchLabels:
      app: smartcampus

  template:
    metadata:
      labels:
        app: smartcampus

    spec:
      containers:
        - name: smartcampus
          image: smartcampus-backend:1.0
          imagePullPolicy: Never

          ports:
            - containerPort: 8000
