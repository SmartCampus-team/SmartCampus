
services:
  db:
    image: smartcampus-db:1.0
    environment:
      POSTGRES_USER: smartcampus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartcampus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcampus -d smartcampus"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: smartcampus-backend:1.0
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://smartcampus:${POSTGRES_PASSWORD}@db:5432/smartcampus
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: smartcampus-frontend:1.0
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
